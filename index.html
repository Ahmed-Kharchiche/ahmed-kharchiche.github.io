<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon site</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 50px;
            color: #60a5fa;
        }

        p {
            font-size: 20px;
            color: #d1d5db;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🚀 Mon site fonctionne !</h1>

        <p>Bienvenue sur ma première page publiée avec GitHub Pages.</p>

        <button onclick="direBonjour()">
            Clique ici
        </button>
    </div>

    <script>
        function direBonjour() {
            alert("Salut ! 🎉 Ta page fonctionne !");
        }
    </script>

</body>
</html>
